name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build pochi.exe
        run: cargo build --release --locked

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $nsis)) { choco install nsis -y --no-progress }
          New-Item -ItemType Directory -Force dist | Out-Null
          & $nsis /DVER=${{ steps.ver.outputs.version }} /DEXE=target\release\pochi.exe installer.nsi
          Copy-Item target\release\pochi.exe dist\Pochi-Portable-${{ steps.ver.outputs.version }}.exe

      - name: Sign Windows executables
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_PASSWORD)
          if (-not $hasCertificate -and -not $hasPassword) {
            Write-Host "Code signing is not configured; executables will remain unsigned."
            exit 0
          }
          if (-not $hasCertificate -or -not $hasPassword) {
            throw "Set both WINDOWS_PFX_BASE64 and WINDOWS_PFX_PASSWORD repository secrets to enable code signing."
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "pochi-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $signtool) {
              throw "Windows SDK signtool.exe was not found on the runner."
            }

            Get-ChildItem dist -Filter *.exe | ForEach-Object {
              & $signtool.FullName sign /fd SHA256 /td SHA256 /tr https://timestamp.digicert.com /f $certificatePath /p $env:WINDOWS_PFX_PASSWORD $_.FullName
              if ($LASTEXITCODE -ne 0) {
                throw "Signing failed for $($_.Name)."
              }
            }
          }
          finally {
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Pochi-${{ steps.ver.outputs.version }}
          path: dist/*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
